name = "arcadia-psicologia"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]

# O ponto de entrada do Worker e os arquivos estaticos sao gerados pelo
# adapter do Astro - nao declarar `main` nem `assets` aqui.

# ---------------------------------------------------------------- banco
[[d1_databases]]
binding = "DB"
database_name = "arcadia"
database_id = "c98b8af9-a5ad-4035-826a-60a9276db48f"

# ---------------------------------------------------------------- sessoes
# Exigido pelo adapter do Astro.
[[kv_namespaces]]
binding = "SESSION"
id = "1107f024f20c49f898001b270b739703"

# ---------------------------------------------------------------- arquivos
# Artes das oficinas e fotos da equipe.
# Usamos KV, e nao R2, porque ativar o R2 exige cadastrar metodo de pagamento
# na conta, mesmo dentro dos 10 GB gratuitos. O KV nao exige. As artes sao
# redimensionadas no navegador antes do upload (ver src/lib/imagem.js), entao
# cada uma fica em 80-150 KB e 1 GB comporta milhares delas.
[[kv_namespaces]]
binding = "MIDIA"
id = "140824fb3efc4e18a3aba689da84d266"

[vars]
FUSO = "America/Sao_Paulo"
CIDADE = "PREENCHER"
EMAIL_REMETENTE = "PREENCHER"

# ---------------------------------------------------------------- segredos
# Nunca versionar. Definir com:  npx wrangler secret put NOME
#   RESEND_API_KEY   -> envio de confirmacao de inscricao
#
# A autenticacao do /admin NAO fica aqui: e responsabilidade do Cloudflare
# Access (Zero Trust > Access > Applications). Nenhuma senha e armazenada
# neste projeto, de proposito.
