name = "arcadia-psicologia"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]

# O ponto de entrada do Worker e os arquivos estáticos são gerados pelo
# adapter do Astro — não declarar `main` nem `assets` aqui.

# ---------------------------------------------------------------- banco
# Criar com:  npx wrangler d1 create arcadia
# e colar o database_id devolvido pelo comando.
[[d1_databases]]
binding = "DB"
database_name = "arcadia"
database_id = "00000000-0000-0000-0000-000000000000"  # PREENCHER com o id real após: npx wrangler d1 create arcadia

# ---------------------------------------------------------------- sessões
# Exigido pelo adapter do Astro.
# Criar com:  npx wrangler kv namespace create SESSION
[[kv_namespaces]]
binding = "SESSION"
id = "PREENCHER_APOS_wrangler_kv_namespace_create"

# ---------------------------------------------------------------- arquivos
# Artes das oficinas e fotos da equipe.
#
# Usamos KV, e não R2, por um motivo específico: ativar o R2 exige cadastrar
# método de pagamento na conta, mesmo permanecendo dentro dos 10 GB gratuitos.
# O KV não exige. Como as artes são redimensionadas no navegador antes do
# upload (ver src/lib/imagem.js), cada uma fica em torno de 80–150 KB, e
# 1 GB de KV comporta milhares delas — folga de sobra para o uso da clínica.
#
# Se um dia o volume justificar, migrar para R2 é trocar este bloco e o
# adaptador em src/lib/midia.js. O limite de 25 MB por valor no KV é o teto real.
#
# Criar com:  npx wrangler kv namespace create MIDIA
[[kv_namespaces]]
binding = "MIDIA"
id = "PREENCHER_APOS_wrangler_kv_namespace_create"

[vars]
FUSO = "America/Sao_Paulo"          # o site atual está em UTC, 3h à frente de Brasília
CIDADE = "PREENCHER"                 # cidade de atuação — hoje não aparece em lugar nenhum
EMAIL_REMETENTE = "PREENCHER"

# ---------------------------------------------------------------- segredos
# Nunca versionar. Definir com:  npx wrangler secret put NOME
#   RESEND_API_KEY   -> envio de confirmação de inscrição
#
# Autenticação do /admin NÃO é feita aqui: fica a cargo do Cloudflare Access
# (Zero Trust > Access > Applications), gratuito até 50 usuários.
# Nenhuma senha é armazenada neste projeto — de propósito.
